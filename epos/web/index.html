<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bontastic ePOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        :root {
            --color-dark: #141414;
            --color-neutral: #faf5f5;
            --color-primary: #00ff00;
            --color-secondary: #9673ff;
            --color-additional-01: #ff3719;
            --color-additional-02: #66f2ff;
            --color-primary-tint-01: #009900;
            --color-primary-tint-02: #00be00;
            --color-primary-tint-03: #00d300;
            --color-primary-tint-04: #00ea00;
            --color-primary-tint-05: #a3ff90;
            --color-primary-tint-06: #ccffbe;
            --color-primary-tint-07: #ebffe5;
            --color-secondary-tint-01: #4d2eed;
            --color-secondary-tint-02: #5c33f4;
            --color-secondary-tint-03: #7952fe;
            --color-secondary-tint-04: #b69dfe;
            --color-secondary-tint-05: #d4c4fe;
            --color-secondary-tint-06: #efe7ff;
        }

        body {
            background: #050505;
            color: var(--color-primary-tint-04);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-image:
                radial-gradient(circle at 1px 1px, rgba(0, 255, 0, .18) 1px, transparent 0),
                linear-gradient(rgba(0, 255, 0, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, .05) 1px, transparent 1px);
            background-size: 4px 4px, 28px 28px, 28px 28px;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(0, 0, 0, .35) 3px 4px);
        }

        input,
        select,
        button {
            font: inherit;
        }
    </style>
</head>

<body>
    <div id="app" class="mx-auto max-w-5xl px-4 py-6 md:py-10">
        <header class="border border-green-400/40 bg-black/70 p-4 md:p-5 shadow-[0_0_32px_rgba(0,255,0,.16)]">
            <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
                <div>
                    <p class="text-xs uppercase tracking-[.35em] text-green-300/70">direct print terminal</p>
                    <h1 class="mt-2 text-3xl text-green-100 md:text-5xl">Bontastic ePOS</h1>
                </div>
                <div class="text-sm uppercase text-green-200/80">
                    <div>ble :: {{ connected ? 'linked' : 'idle' }}</div>
                    <div>ip :: {{ ip || '0.0.0.0' }}</div>
                </div>
            </div>
            <div class="mt-5 flex flex-wrap gap-3">
                <button @click="connect" :disabled="busy || connected"
                    class="border border-green-300/60 bg-green-400/10 px-4 py-2 text-green-100 disabled:opacity-40">connect</button>
                <button @click="disconnect" :disabled="!connected"
                    class="border border-red-400/60 bg-red-500/10 px-4 py-2 text-red-200 disabled:opacity-40">disconnect</button>
                <button @click="writeAction('connect')" :disabled="!connected"
                    class="border border-cyan-300/60 bg-cyan-400/10 px-4 py-2 text-cyan-100 disabled:opacity-40">wifi connect</button>
                <button @click="writeAction('reboot')" :disabled="!connected"
                    class="border border-purple-300/60 bg-purple-400/10 px-4 py-2 text-purple-100 disabled:opacity-40">reboot</button>
            </div>
        </header>

        <main class="mt-6 grid gap-6 lg:grid-cols-[1fr_1fr]">
            <section class="border border-green-400/25 bg-black/60 p-4">
                <h2 class="text-lg text-green-100">WiFi</h2>
                <div class="mt-4 grid gap-3">
                    <label class="grid gap-1 text-sm text-green-200/80">
                        <span>SSID</span>
                        <input v-model="wifi.ssid" :disabled="!connected"
                            class="border border-green-500/30 bg-black px-3 py-2 text-green-50 outline-none focus:border-green-300">
                    </label>
                    <label class="grid gap-1 text-sm text-green-200/80">
                        <span>Password</span>
                        <input v-model="wifi.pass" type="password" :disabled="!connected"
                            class="border border-green-500/30 bg-black px-3 py-2 text-green-50 outline-none focus:border-green-300">
                    </label>
                    <button @click="saveWifi" :disabled="!connected"
                        class="mt-2 border border-green-300/60 bg-green-400/10 px-4 py-2 text-green-100 disabled:opacity-40">save
                        credentials</button>
                </div>
            </section>

            <section class="border border-green-400/25 bg-black/60 p-4">
                <h2 class="text-lg text-green-100">Diagnostics</h2>
                <div class="mt-4 grid gap-3">
                    <textarea v-model="testText" rows="4" :disabled="!connected"
                        class="border border-green-500/30 bg-black px-3 py-2 text-green-50 outline-none focus:border-green-300"></textarea>
                    <div class="flex flex-wrap gap-3">
                        <button @click="writeAction('test')" :disabled="!connected"
                            class="border border-green-300/60 bg-green-400/10 px-4 py-2 text-green-100 disabled:opacity-40">print
                            test</button>
                        <button @click="postSample" :disabled="!ip"
                            class="border border-cyan-300/60 bg-cyan-400/10 px-4 py-2 text-cyan-100 disabled:opacity-40">http
                            sample</button>
                    </div>
                    <pre class="min-h-16 border border-green-500/20 bg-black/80 p-3 text-xs text-green-200/80">{{ log }}</pre>
                </div>
            </section>

            <section class="border border-green-400/25 bg-black/60 p-4 lg:col-span-2">
                <h2 class="text-lg text-green-100">Printer</h2>
                <div class="mt-4 grid gap-4 md:grid-cols-3">
                    <label class="grid gap-2 text-sm text-green-200/80">
                        <span>RX pin</span>
                        <input type="number" min="0" max="39" v-model.number="settings.rx" @change="saveSetting('rx')"
                            :disabled="!connected"
                            class="border border-green-500/30 bg-black px-3 py-2 text-green-50 outline-none focus:border-green-300">
                    </label>
                    <label class="grid gap-2 text-sm text-green-200/80">
                        <span>TX pin</span>
                        <input type="number" min="0" max="39" v-model.number="settings.tx" @change="saveSetting('tx')"
                            :disabled="!connected"
                            class="border border-green-500/30 bg-black px-3 py-2 text-green-50 outline-none focus:border-green-300">
                    </label>
                    <label class="grid gap-2 text-sm text-green-200/80">
                        <span>Error pin</span>
                        <input type="number" min="0" max="39" v-model.number="settings.err" @change="saveSetting('err')"
                            :disabled="!connected"
                            class="border border-green-500/30 bg-black px-3 py-2 text-green-50 outline-none focus:border-green-300">
                    </label>
                    <label v-for="f in sliders" :key="f.key" class="grid gap-2 text-sm text-green-200/80">
                        <span>{{ f.label }} :: {{ settings[f.key] }}</span>
                        <input type="range" :min="f.min" :max="f.max" v-model.number="settings[f.key]"
                            @change="saveSetting(f.key)" :disabled="!connected" class="accent-green-400">
                    </label>
                    <label class="grid gap-2 text-sm text-green-200/80">
                        <span>Font</span>
                        <select v-model.number="settings.font" @change="saveSetting('font')" :disabled="!connected"
                            class="border border-green-500/30 bg-black px-3 py-2 text-green-50">
                            <option :value="0">A</option>
                            <option :value="1">B</option>
                        </select>
                    </label>
                    <label class="grid gap-2 text-sm text-green-200/80">
                        <span>Size</span>
                        <select v-model.number="settings.size" @change="saveSetting('size')" :disabled="!connected"
                            class="border border-green-500/30 bg-black px-3 py-2 text-green-50">
                            <option :value="0">Normal</option>
                            <option :value="1">Tall</option>
                            <option :value="2">Large</option>
                        </select>
                    </label>
                    <label class="grid gap-2 text-sm text-green-200/80">
                        <span>Justify</span>
                        <select v-model.number="settings.justify" @change="saveSetting('justify')" :disabled="!connected"
                            class="border border-green-500/30 bg-black px-3 py-2 text-green-50">
                            <option :value="0">Left</option>
                            <option :value="1">Center</option>
                            <option :value="2">Right</option>
                        </select>
                    </label>
                </div>
            </section>
        </main>
    </div>

    <script>
        const { createApp } = Vue;
        const enc = new TextEncoder();
        const dec = new TextDecoder();
        const uuids = {
            service: '6d0f0001-9256-49f3-8a9b-1f0d0e905001',
            ssid: '6d0f0002-9256-49f3-8a9b-1f0d0e905001',
            pass: '6d0f0003-9256-49f3-8a9b-1f0d0e905001',
            ip: '6d0f0004-9256-49f3-8a9b-1f0d0e905001',
            setting: '6d0f0005-9256-49f3-8a9b-1f0d0e905001',
            action: '6d0f0006-9256-49f3-8a9b-1f0d0e905001'
        };

        createApp({
            data() {
                return {
                    busy: false,
                    connected: false,
                    chars: {},
                    ip: '',
                    log: '',
                    wifi: { ssid: '', pass: '' },
                    testText: 'Bontastic ePOS\nHTTP print ready\n',
                    settings: {
                        rx: 1, tx: 2, err: 22,
                        heatDots: 11, heatTime: 120, heatInterval: 40, density: 10, breakTime: 2,
                        lineHeight: 30, font: 0, size: 0, justify: 0
                    },
                    sliders: [
                        { key: 'heatDots', label: 'Heat dots', min: 0, max: 15 },
                        { key: 'heatTime', label: 'Heat time', min: 0, max: 255 },
                        { key: 'heatInterval', label: 'Heat interval', min: 0, max: 255 },
                        { key: 'density', label: 'Density', min: 0, max: 31 },
                        { key: 'breakTime', label: 'Break time', min: 0, max: 7 },
                        { key: 'lineHeight', label: 'Line height', min: 0, max: 80 }
                    ]
                };
            },
            methods: {
                note(v) { this.log = `${new Date().toLocaleTimeString()} ${v}\n${this.log}`; },
                applySettingsValue(value) {
                    value.split(';').forEach(part => {
                        const [key, raw] = part.split('=');
                        if (key && raw !== undefined && Object.prototype.hasOwnProperty.call(this.settings, key)) {
                            this.settings[key] = Number(raw);
                        }
                    });
                },
                async connect() {
                    this.busy = true;
                    try {
                        const device = await navigator.bluetooth.requestDevice({
                            filters: [{ services: [uuids.service] }],
                            optionalServices: [uuids.service]
                        });
                        device.addEventListener('gattserverdisconnected', () => { this.connected = false; });
                        const server = await device.gatt.connect();
                        const service = await server.getPrimaryService(uuids.service);
                        for (const [key, uuid] of Object.entries(uuids)) {
                            if (key !== 'service') this.chars[key] = await service.getCharacteristic(uuid);
                        }
                        this.wifi.ssid = dec.decode(await this.chars.ssid.readValue());
                        this.ip = dec.decode(await this.chars.ip.readValue());
                        this.applySettingsValue(dec.decode(await this.chars.setting.readValue()));
                        await this.chars.ip.startNotifications();
                        this.chars.ip.addEventListener('characteristicvaluechanged', e => {
                            this.ip = dec.decode(e.target.value);
                            this.note(`ip ${this.ip}`);
                        });
                        await this.chars.setting.startNotifications();
                        this.chars.setting.addEventListener('characteristicvaluechanged', e => {
                            this.applySettingsValue(dec.decode(e.target.value));
                            this.note('settings synced');
                        });
                        this.connected = true;
                        this.note('connected');
                    } catch (e) {
                        this.note(e.message);
                    }
                    this.busy = false;
                },
                disconnect() {
                    location.reload();
                },
                async writeChar(name, value) {
                    await this.chars[name].writeValue(enc.encode(String(value)));
                },
                async saveWifi() {
                    await this.writeChar('ssid', this.wifi.ssid);
                    await this.writeChar('pass', this.wifi.pass);
                    this.note('wifi saved');
                },
                async saveSetting(key) {
                    await this.writeChar('setting', `${key}=${this.settings[key]}`);
                    this.note(`${key}=${this.settings[key]}`);
                },
                async writeAction(action) {
                    await this.writeChar('action', action);
                    this.note(action);
                },
                async postSample() {
                    const xml = `<?xml version="1.0"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body><epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print"><text align="center" width="2" height="2">${this.testText.replaceAll('&', '&amp;').replaceAll('<', '&lt;')}&#10;</text><feed line="3"/><cut type="feed"/></epos-print></s:Body></s:Envelope>`;
                    const r = await fetch(`http://${this.ip}/cgi-bin/epos/service.cgi?devid=local_printer&timeout=10000`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/xml; charset=utf-8', 'SOAPAction': '""' },
                        body: xml
                    });
                    this.note(await r.text());
                }
            }
        }).mount('#app');
    </script>
</body>

</html>
